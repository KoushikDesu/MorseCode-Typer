<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Morse Code Floating Typer</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0c101a;
      color: #f0f6fc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header img {
      width: 32px;
      height: 32px;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      color: #00f0ff;
    }
    .desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #00f0ff;
      color: #000;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background: #1e293b;
      color: #f0f6fc;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon.svg" alt="Logo">
    <div class="title">Morse Code Typer</div>
  </div>
  <div class="desc">
    The floating ball is active on all webpages! Click any text box, then click/hold on the floating ball to transmit.
  </div>
  <button class="btn" id="openWebAppBtn">Open Web App</button>
  <button class="btn btn-secondary" id="helpGuideBtn">User Guide</button>
  <script src="popup.js"></script>
</body>
</html>
