<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Morse Code Floating Typer</title>
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #090d16;
      color: #f0f6fc;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header img {
      width: 34px;
      height: 34px;
      filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      color: #00f0ff;
      letter-spacing: 0.5px;
    }
    .sub {
      font-size: 11px;
      color: #94a3b8;
    }
    
    /* Master Power Switch Card */
    .power-card {
      background: #131b2c;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .power-label {
      font-size: 13px;
      font-weight: 700;
      color: #f0f6fc;
    }
    .power-desc {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Modern Glowing Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: .25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    input:checked + .slider {
      background: linear-gradient(135deg, #00f0ff, #2563eb);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #00f0ff;
      color: #000;
      border: none;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #1e293b;
      color: #f0f6fc;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #27354a;
      color: #00f0ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon.svg" alt="Logo">
    <div>
      <div class="title">Morse Code Typer</div>
      <div class="sub">Floating Assistant Controller</div>
    </div>
  </div>

  <!-- Master Power Switch -->
  <div class="power-card">
    <div>
      <div class="power-label" id="statusLabel">Floating Typer: ON</div>
      <div class="power-desc">Show/Hide floating ball on web</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="masterPowerToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button class="btn" id="openWebAppBtn">🌐 Open Morse Web App</button>
  <button class="btn btn-secondary" id="helpGuideBtn">📖 User Guide & Tutorials</button>

  <script src="popup.js"></script>
</body>
</html>
